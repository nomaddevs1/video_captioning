[phases.setup]
# pango/cairo/gdk-pixbuf/harfbuzz/fontconfig are WeasyPrint's native rendering
# dependencies (replaces the unmaintained wkhtmltopdf binary)
nixPkgs = ["python310", "ffmpeg", "pango", "cairo", "gdk-pixbuf", "harfbuzz", "fontconfig"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "uvicorn server:app --host 0.0.0.0 --port $PORT"